name: live-tools

# Reconciles the tool documentation against the live server's tools/list. Nightly and on demand
# only, never on a pull request: a server outage must not block a merge.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-live-tools.mjs
