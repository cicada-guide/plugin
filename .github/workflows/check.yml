name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check.mjs
      # Claude Code's own validator, pinned so a new release cannot fail a pull request
      # unannounced. --strict fails on warnings too.
      - name: claude plugin validate
        env:
          CLAUDE_CODE: "@anthropic-ai/claude-code@2.1.286"
        run: |
          npx --yes "$CLAUDE_CODE" plugin validate --strict .claude-plugin/marketplace.json
          npx --yes "$CLAUDE_CODE" plugin validate --strict .claude-plugin/plugin.json
          npx --yes "$CLAUDE_CODE" plugin validate --strict skills
          npx --yes "$CLAUDE_CODE" plugin validate --strict agents
